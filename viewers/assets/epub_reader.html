<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>__TITLE__</title>
  <link rel="stylesheet" href="__CSS_URL__">
</head>
<body>
  <div id="epub-toolbar">
    <button id="prevChapter" title="Capítulo anterior ([)">◀</button>
    <span id="chapterIndicator">1 / __TOTAL__</span>
    <button id="nextChapter" title="Siguiente capítulo (])">▶</button>
    <span class="divider"></span>
    <button id="zoomOut" title="Reducir zoom (Ctrl -)">−</button>
    <span id="zoomIndicator">100%</span>
    <button id="zoomIn" title="Aumentar zoom (Ctrl +)">+</button>
    <span class="spacer"></span>
    <span class="muted">__BOOK_NAME__</span>
  </div>
  <div id="progress-track"><div id="progress-fill"></div></div>
  <div class="page-stack">__PAGES__</div>
  <script src="__JS_URL__"></script>
</body>
</html>
